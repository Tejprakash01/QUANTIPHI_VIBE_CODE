services:
  # ==========================================
  # 1. FastAPI Backend Web Service
  # ==========================================
  - type: web
    name: devportfolio-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: GITHUB_TOKEN
        sync: false

  # ==========================================
  # 2. React (Vite) Frontend Static Site
  # ==========================================
  - type: web
    name: devportfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      # SPA client-side routing fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: devportfolio-backend
          property: host
